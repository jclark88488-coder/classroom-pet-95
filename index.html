<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLASS PET 95</title><style>
*{box-sizing:border-box}body{margin:0;background:#008080;font:14px 'Trebuchet MS',Tahoma,sans-serif;color:#111;padding:12px}.window{max-width:590px;margin:auto;background:#c0c0c0;border:3px solid;border-color:#fff #454545 #454545 #fff;box-shadow:2px 2px #111}.bar{background:linear-gradient(90deg,#000080,#1489ad);color:white;padding:7px 9px;display:flex;justify-content:space-between;font-weight:bold;letter-spacing:.5px}.bar small{background:#c0c0c0;color:black;padding:0 6px;border:1px solid white}.menu{padding:7px 10px;border-bottom:1px solid #888}.content{padding:12px}.scene{position:relative;height:208px;overflow:hidden;background:linear-gradient(#a6e8fa 0 68%,#8ed778 68%);border:3px inset #eee;display:flex;align-items:center;justify-content:center}.sun{position:absolute;top:15px;right:25px;width:38px;height:38px;border-radius:50%;background:#ffe36a}.cloud{position:absolute;top:28px;left:35px;color:white;font-size:32px}.ground{position:absolute;bottom:15px;left:0;width:100%;text-align:center;color:#477c34;letter-spacing:14px}.pet{width:160px;height:160px;image-rendering:pixelated;position:relative;z-index:1;animation:bob 1.9s ease-in-out infinite}.pet.happy{animation:jump .45s ease-in-out 3}.pet.sleep{animation:none;filter:brightness(.8)}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes jump{50%{transform:translateY(-27px)}}.speech{background:#fff9c8;border:2px solid #222;padding:7px;margin:10px 0;text-align:center;min-height:36px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.stat label{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;margin-bottom:3px}.track{height:15px;border:2px inset #eee;background:#fff}.fill{height:100%;background:repeating-linear-gradient(90deg,#168b49 0 10px,#20b85c 10px 12px);transition:width .3s}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}button,input{font:inherit}button{background:#c0c0c0;border:2px solid;border-color:white #555 #555 white;padding:9px 5px;cursor:pointer;font-weight:bold}button:active{border-color:#555 white white #555}button:focus-visible{outline:3px solid #000080}.footer{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #888;padding-top:9px;margin-top:12px;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.controls button{font-size:12px;padding:6px 9px}.name{font-weight:bold}.muted{color:#444}dialog{background:#c0c0c0;border:3px solid #222;max-width:min(94vw,380px);padding:16px}dialog::backdrop{background:#0007}input{width:100%;padding:7px;margin:8px 0;border:2px inset #eee}@media(max-width:410px){body{padding:3px}.content{padding:7px}.actions{grid-template-columns:repeat(2,1fr)}.scene{height:165px}.pet{width:130px;height:130px}}
</style></head><body><main class="window"><header class="bar"><span>🐣 CLASSPET.EXE — Windows 95 Edition</span><small>_ □ ×</small></header><div class="menu">File　 Pet　 Activities　 Help</div><div class="content"><div class="scene"><div class="sun"></div><div class="cloud">☁</div><canvas id="pet" class="pet" width="16" height="16" aria-label="Animated pixel-art classroom pet" role="img"></canvas><div class="ground">✿ ✿ ✿ ✿ ✿</div></div><div class="speech" id="message" aria-live="polite">Welcome to your classroom pet!</div><div class="name" id="petName">Pixel</div><div class="stats"><div class="stat"><label>🍎 FULLNESS <span id="foodN"></span></label><div class="track"><div class="fill" id="food"></div></div></div><div class="stat"><label>💗 HAPPINESS <span id="happyN"></span></label><div class="track"><div class="fill" id="happy"></div></div></div><div class="stat"><label>⚡ ENERGY <span id="energyN"></span></label><div class="track"><div class="fill" id="energy"></div></div></div><div class="stat"><label>✨ CLEANLINESS <span id="cleanN"></span></label><div class="track"><div class="fill" id="clean"></div></div></div></div><div class="actions"><button data-action="feed">🍎 Feed</button><button data-action="play">🎾 Play</button><button data-action="rest">💤 Rest</button><button data-action="clean">🫧 Clean</button></div><div class="controls"><button id="rename">✎ Rename</button><button id="daily">⭐ Daily check-in</button><button id="sound">🔇 Sound: Off</button><button id="reset">↻ Reset pet</button></div><div class="footer"><span id="status">STATUS: READY</span><span id="stars">⭐ 0 stars</span></div><p class="muted" style="font-size:11px;margin:8px 0 0">A friendly classroom companion. Needs change gently over time; your pet never dies. Progress is saved on this browser.</p></div></main><dialog id="nameDialog"><form method="dialog" id="nameForm"><strong>Rename your classroom pet</strong><input id="nameInput" maxlength="18" placeholder="Pet name" required><div style="display:flex;gap:8px;justify-content:flex-end"><button value="cancel">Cancel</button><button id="saveName" value="save">Save</button></div></form></dialog><script>
(()=>{'use strict';const KEY='classpet95_v1',day=86400000;const $=id=>document.getElementById(id);let sound=false;let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||typeof state!=='object')state={name:'Pixel',food:80,happy:85,energy:80,clean:90,stars:0,last:Date.now(),checkin:''};const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function decay(){const now=Date.now(),hours=Math.max(0,Math.min(240,(now-(Number(state.last)||now))/3600000));state.food=clamp((Number(state.food)||0)-hours*.55);state.happy=clamp((Number(state.happy)||0)-hours*.3);state.energy=clamp((Number(state.energy)||0)-hours*.22);state.clean=clamp((Number(state.clean)||0)-hours*.25);state.last=now;save()}function message(s){$('message').textContent=s}function render(){ $('petName').textContent='🐾 '+state.name;for(const k of ['food','happy','energy','clean']){let v=clamp(Number(state[k])||0);$(k).style.width=v+'%';$(k+'N').textContent=v+'%';$(k).style.background=v<25?'#d94b4b':''} $('stars').textContent='⭐ '+(state.stars||0)+' stars';$('status').textContent=state.energy<20?'STATUS: SLEEPY':state.food<20?'STATUS: HUNGRY':'STATUS: HAPPY';draw()}const patterns=["................",".....AAAAAA.....","...AAAAAAAAAA...","..AAAAAAAAAAAA..","..AABBAAAABBAA..",".AAAAAAAAAAAAAA.",".AAWWAAAAAAWWAA.",".AAKKAAAAAAKKAA.",".AAAAAAAAAAAAAA.",".AAAAAAKKAAAAAA.","..AAAAAKKAAAAA..","..AAAAAAAAAAAA..","...AAAAAAAAAA...","....AA....AA....","...AAA....AAA...","................"];const colors={A:'#ffbcd9',B:'#f18bb9',W:'#ffffff',K:'#27203c'};const canvas=$('pet'),ctx=canvas.getContext('2d');function draw(){ctx.clearRect(0,0,16,16);const sleepy=state.energy<20;patterns.forEach((row,y)=>[...row].forEach((p,x)=>{if(p==='.')return;ctx.fillStyle=colors[p];if(sleepy&&p==='K'&&y===7)ctx.fillStyle='#ffbcd9';ctx.fillRect(x,y,1,1)}));if(sleepy){ctx.fillStyle='#27203c';ctx.fillRect(3,7,3,1);ctx.fillRect(10,7,3,1)}}function beep(){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=650;g.gain.value=.035;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch(e){}}function celebrate(){canvas.classList.remove('happy');void canvas.offsetWidth;canvas.classList.add('happy');setTimeout(()=>canvas.classList.remove('happy'),1500)}function action(a){decay();if(a==='feed'){state.food=clamp(state.food+22);state.clean=clamp(state.clean-4);message('Yum! '+state.name+' loved that snack! 🍎')}if(a==='play'){if(state.energy<10){message(state.name+' is tired. Try Rest first!');render();return}state.happy=clamp(state.happy+22);state.energy=clamp(state.energy-9);state.food=clamp(state.food-5);message('Wheee! That was fun! 🎾')}if(a==='rest'){state.energy=clamp(state.energy+24);message('A lovely little nap! 💤')}if(a==='clean'){state.clean=clamp(state.clean+30);state.happy=clamp(state.happy+4);message('Squeaky clean! 🫧')}state.stars=(Number(state.stars)||0)+1;save();render();celebrate();beep()}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));$('rename').onclick=()=>{$('nameInput').value=state.name;$('nameDialog').showModal()};$('nameDialog').addEventListener('close',()=>{if($('nameDialog').returnValue==='save'){let n=$('nameInput').value.trim();if(n){state.name=n.slice(0,18);save();render();message('Hello, '+state.name+'!')}}});$('daily').onclick=()=>{const today=new Date().toLocaleDateString('en-CA');if(state.checkin===today){message('You already earned today’s check-in bonus! 🌟');return}state.checkin=today;state.stars=(Number(state.stars)||0)+5;state.happy=clamp(state.happy+10);save();render();celebrate();message('Daily classroom check-in: +5 stars! 🌟')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound: On':'🔇 Sound: Off';beep()};$('reset').onclick=()=>{if(!confirm('Reset pet progress and stars?'))return;state={name:'Pixel',food:80,happy:85,energy:80,clean:90,stars:0,last:Date.now(),checkin:''};save();render();message('A fresh start for your classroom pet!')};decay();render();setInterval(()=>{decay();render()},60000)})();
</script></body></html>
